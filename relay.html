<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>크림이 런너 - TOP 10</title>
<style>
  :root{
    --sky-top:#8ec9ef; --sky-bottom:#eaf6ff; --panel:#fffaf0; --panel-border:#3a4a63;
    --ink:#2b3a54; --ink-soft:#6c7893; --accent:#ffb845; --accent-deep:#e08a1e; --accent-blue:#3a6ea5;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:'Nunito',-apple-system,'Malgun Gothic',sans-serif;
    background:linear-gradient(var(--sky-top),var(--sky-bottom));
    padding:24px 16px;
  }
  .card{
    background:var(--panel); border:3px solid var(--panel-border); border-radius:22px;
    padding:26px 22px; max-width:380px; width:100%; text-align:center;
    box-shadow:0 10px 0 rgba(31,43,61,.18), 0 16px 30px rgba(31,43,61,.25);
  }
  h1{ margin:0 0 4px; font-size:22px; color:var(--ink); }
  p.sub{ margin:0 0 16px; font-size:13px; color:var(--ink-soft); }
  .score-box{
    background:#fff; border:2px solid var(--panel-border); border-radius:12px;
    padding:8px 14px; display:inline-block; margin-bottom:16px;
  }
  .score-box .label{ display:block; font-size:11px; color:var(--ink-soft); font-weight:700; }
  .score-box .value{ font-size:22px; font-weight:800; color:var(--accent-deep); }
  .name-row{ display:flex; gap:6px; margin-bottom:18px; }
  .name-row input{
    flex:1 1 auto; min-width:0; font-size:14px; padding:10px; border:2px solid var(--panel-border);
    border-radius:10px;
  }
  button{
    font-family:inherit; font-size:15px; font-weight:700; color:#fff;
    background:linear-gradient(180deg,#4c86c7,var(--accent-blue)); border:none; border-radius:12px;
    padding:10px 18px; cursor:pointer; box-shadow:0 4px 0 #274a72;
  }
  button:active{ transform:translateY(3px); box-shadow:0 1px 0 #274a72; }
  button:disabled{ opacity:.6; cursor:default; }
  .list{ list-style:none; margin:0 0 6px; padding:0; text-align:left; max-height:280px; overflow-y:auto; }
  .list li{
    display:flex; align-items:center; gap:8px; padding:6px 4px; font-size:13.5px;
    border-bottom:1px solid rgba(31,43,61,.08); color:var(--ink);
  }
  .list .rank{ flex:0 0 26px; font-weight:800; color:var(--accent-deep); }
  .list .name{ flex:1 1 auto; min-width:0; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .list .score{ flex:0 0 auto; color:var(--accent-blue); font-weight:700; }
  .list .date{ flex:0 0 auto; font-size:10.5px; color:var(--ink-soft); }
  .status{ font-size:13px; color:var(--ink-soft); margin:10px 0; }
  .hint{ font-size:11.5px; color:var(--ink-soft); margin-top:14px; }
</style>
</head>
<body>
<div class="card">
  <h1>🏆 크림이 런너 TOP 10</h1>
  <p class="sub">등록 후 이 탭을 닫고 게임으로 돌아가면 돼요</p>

  <div id="scoreArea"></div>
  <div id="formArea"></div>
  <div id="status" class="status">불러오는 중...</div>
  <ol id="list" class="list"></ol>
  <p class="hint">이 페이지는 크림이 런너의 점수판이에요.</p>
</div>

<script>
(function(){
  "use strict";
  var API_URL = 'https://script.google.com/macros/s/AKfycby8ffNr-dfwMFx9jE-HNGYR8hT1H9HVtkfx3ZD7iCl4jIkRQbUGAYWfLhtasHXo_NPH/exec';

  var params = new URLSearchParams(window.location.search);
  var incomingScore = parseInt(params.get('score'), 10);
  var incomingDate = params.get('date') || '';
  var hasIncomingScore = !isNaN(incomingScore);

  var scoreArea = document.getElementById('scoreArea');
  var formArea = document.getElementById('formArea');
  var statusEl = document.getElementById('status');
  var listEl = document.getElementById('list');

  if (hasIncomingScore) {
    scoreArea.innerHTML =
      '<div class="score-box"><span class="label">이번 점수</span>' +
      '<span class="value">' + incomingScore + '</span></div>';
  }

  function renderList(list){
    listEl.innerHTML = '';
    if (!list.length){
      statusEl.textContent = '아직 기록이 없어요. 첫 기록의 주인공이 되어보세요!';
      return;
    }
    statusEl.textContent = '';
    list.forEach(function(e, i){
      var li = document.createElement('li');
      li.innerHTML =
        '<span class="rank">' + (i + 1) + '위</span>' +
        '<span class="name"></span>' +
        '<span class="score">' + e.score + '점</span>' +
        '<span class="date">' + (e.date || '') + '</span>';
      li.querySelector('.name').textContent = e.name;
      listEl.appendChild(li);
    });
  }

  function loadList(){
    statusEl.textContent = '불러오는 중...';
    return fetch(API_URL, { method: 'GET' })
      .then(function(r){ return r.json(); })
      .then(function(data){
        var list = Array.isArray(data) ? data : [];
        renderList(list);
        return list;
      })
      .catch(function(e){
        statusEl.textContent = '순위를 불러오지 못했어요: ' + e;
        return null;
      });
  }

  function showNameForm(){
    formArea.innerHTML =
      '<div class="name-row">' +
      '<input id="nameInput" type="text" maxlength="8" placeholder="이름 입력">' +
      '<button id="submitBtn">등록</button>' +
      '</div>';
    document.getElementById('submitBtn').addEventListener('click', function(){
      var btn = this;
      var name = (document.getElementById('nameInput').value || '').trim() || '익명';
      name = name.slice(0, 8);
      btn.disabled = true;
      btn.textContent = '등록 중...';
      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ name: name, score: incomingScore, date: incomingDate })
      })
        .then(function(r){ return r.json(); })
        .then(function(data){
          renderList(Array.isArray(data) ? data : []);
          formArea.innerHTML = '<div class="status">✅ 등록 완료! 이 탭은 닫아도 돼요.</div>';
        })
        .catch(function(e){
          btn.disabled = false;
          btn.textContent = '등록';
          alert('등록 실패: ' + e);
        });
    });
  }

  loadList().then(function(){
    if (hasIncomingScore) showNameForm();
  });
})();
</script>
</body>
</html>
